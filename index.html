<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сравнительный анализ таблиц</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --error: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin: 0 0 1.75rem;
    }
    .period-caption {
      font-size: 0.82rem;
      color: var(--muted);
      margin: -0.25rem 0 0.65rem;
    }
    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1.35rem;
      margin-bottom: 1rem;
    }
    section h2 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0 0 1rem;
      font-weight: 600;
    }
    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 0.35rem;
      color: var(--muted);
    }
    input[type="text"],
    input[type="password"],
    input[type="number"],
    input[type="date"],
    input[type="time"] {
      width: 100%;
      padding: 0.55rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 0.85rem;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .range-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem 1rem;
    }
    @media (max-width: 520px) {
      .range-grid { grid-template-columns: 1fr; }
    }
    .range-grid label { margin-bottom: 0.25rem; }
    .range-grid input { margin-bottom: 0; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-top: 0.25rem;
    }
    button.primary {
      padding: 0.65rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button.primary:hover { background: var(--accent-hover); }
    button.primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    button.secondary {
      padding: 0.65rem 1.1rem;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }
    button.secondary:hover { border-color: var(--accent); }
    #status {
      margin-top: 1rem;
      font-size: 0.9rem;
      min-height: 1.4em;
    }
    #status.ok { color: var(--success); }
    #status.err { color: var(--error); }
    #tableSection {
      margin-top: 1rem;
      display: none;
    }
    #tableSection > label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    .data-table th,
    .data-table td {
      border-bottom: 1px solid var(--border);
      padding: 0.55rem 0.75rem;
      text-align: left;
      vertical-align: top;
    }
    .data-table th {
      background: #243044;
      color: var(--text);
      font-weight: 600;
      position: sticky;
      top: 0;
    }
    .data-table tbody tr:last-child td {
      border-bottom: none;
    }
    .data-table tbody tr:hover {
      background: rgba(59, 130, 246, 0.07);
    }
    .data-table td:first-child {
      color: var(--text);
    }
    .data-table td:last-child {
      white-space: nowrap;
    }
    .hint {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: -0.5rem;
      margin-bottom: 0.85rem;
    }
    .saved-note {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Сравнительный анализ таблиц</h1>

    <section>
      <h2>Параметры</h2>
      <label for="project_id">Номер проекта</label>
      <input type="text" id="project_id" placeholder="xx" autocomplete="off">

      <label for="api_key">api_key</label>
      <input type="password" id="api_key" placeholder="ключ API" autocomplete="off">

      <label for="card_id">Номер карты</label>
      <input type="number" id="card_id" min="1" step="1" placeholder="1">
    </section>

    <section>
      <h2>Период 1</h2>
      <div class="range-grid">
        <div>
          <label for="date_from_p1">Дата начала</label>
          <input type="date" id="date_from_p1">
        </div>
        <div>
          <label for="time_from_p1">Время начала</label>
          <input type="time" id="time_from_p1" step="1">
        </div>
        <div>
          <label for="date_to_p1">Дата окончания</label>
          <input type="date" id="date_to_p1">
        </div>
        <div>
          <label for="time_to_p1">Время окончания</label>
          <input type="time" id="time_to_p1" step="1">
        </div>
      </div>
    </section>

    <section>
      <h2>Период 2</h2>
      <div class="range-grid">
        <div>
          <label for="date_from_p2">Дата начала</label>
          <input type="date" id="date_from_p2">
        </div>
        <div>
          <label for="time_from_p2">Время начала</label>
          <input type="time" id="time_from_p2" step="1">
        </div>
        <div>
          <label for="date_to_p2">Дата окончания</label>
          <input type="date" id="date_to_p2">
        </div>
        <div>
          <label for="time_to_p2">Время окончания</label>
          <input type="time" id="time_to_p2" step="1">
        </div>
      </div>
    </section>

    <section>
      <h2>Действия</h2>
      <div class="actions">
        <button type="button" class="primary" id="btnFetch">Загрузить данные</button>
        <button type="button" class="secondary" id="btnDownload" disabled>Скачать XLSX</button>
        <button type="button" class="secondary" id="btnCopyUrl">Скопировать URL</button>
      </div>
      <p class="saved-note" id="savedNote"></p>
      <div id="status"></div>
      <div id="tableSection">
        <label>Сравнение</label>
        <p class="period-caption" id="periodCaption"></p>
        <div class="table-wrap">
          <table class="data-table" id="dataTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script>
    const PROXY_BASE = "https://robotmia-analytics-proxy.a-mozzherin.workers.dev";
    const STORAGE_KEY = "analytics-custom-card-settings";

    let lastSheetAoa = null;
    let lastFilename = "custom-card.xlsx";

    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    /** DD.MM.YYYY для API */
    function formatApiDate(d) {
      return `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.${d.getFullYear()}`;
    }

    function formatApiTimeFromInput(value) {
      if (!value) return "00:00:00";
      const parts = value.split(":");
      const h = parts[0] || "00";
      const m = parts[1] || "00";
      const s = parts[2] || "00";
      return `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
    }

    function toInputDate(d) {
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }

    function startOfDay(d) {
      const x = new Date(d);
      x.setHours(0, 0, 0, 0);
      return x;
    }

    function endOfDay(d) {
      const x = new Date(d);
      x.setHours(23, 59, 59, 999);
      return x;
    }

    function setPeriodRange(prefix, fromDate, toDate) {
      document.getElementById("date_from_" + prefix).value = toInputDate(fromDate);
      document.getElementById("time_from_" + prefix).value = "00:00:00";
      document.getElementById("date_to_" + prefix).value = toInputDate(toDate);
      document.getElementById("time_to_" + prefix).value = "23:59:59";
    }

    /** Период 2: 7 дней до вчера; период 1: 7 дней перед периодом 2 */
    function applyDefaultPeriods() {
      const today = startOfDay(new Date());
      const p2End = new Date(today);
      p2End.setDate(p2End.getDate() - 1);
      const p2Start = new Date(p2End);
      p2Start.setDate(p2Start.getDate() - 6);

      const p1End = new Date(p2Start);
      p1End.setDate(p1End.getDate() - 1);
      const p1Start = new Date(p1End);
      p1Start.setDate(p1Start.getDate() - 6);

      setPeriodRange("p1", p1Start, p1End);
      setPeriodRange("p2", p2Start, p2End);
    }

    function readPeriodFields(prefix) {
      return {
        date_from: document.getElementById("date_from_" + prefix).value,
        time_from: document.getElementById("time_from_" + prefix).value,
        date_to: document.getElementById("date_to_" + prefix).value,
        time_to: document.getElementById("time_to_" + prefix).value,
      };
    }

    function readForm() {
      return {
        project_id: document.getElementById("project_id").value.trim(),
        api_key: document.getElementById("api_key").value.trim(),
        card_id: document.getElementById("card_id").value.trim(),
        period1: readPeriodFields("p1"),
        period2: readPeriodFields("p2"),
      };
    }

    function formatPeriodLabel(period) {
      const from = new Date(period.date_from + "T00:00:00");
      const to = new Date(period.date_to + "T00:00:00");
      return formatApiDate(from) + "–" + formatApiDate(to);
    }

    function saveSettings() {
      const f = readForm();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          project_id: f.project_id,
          api_key: f.api_key,
          card_id: f.card_id,
        }));
        document.getElementById("savedNote").textContent =
          "Настройки сохранены в этом браузере.";
      } catch (_) {
        document.getElementById("savedNote").textContent = "";
      }
    }

    function loadSettings() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const s = JSON.parse(raw);
        if (s.project_id) document.getElementById("project_id").value = s.project_id;
        if (s.api_key) document.getElementById("api_key").value = s.api_key;
        if (s.card_id) document.getElementById("card_id").value = s.card_id;
        document.getElementById("savedNote").textContent =
          "Загружены сохранённые настройки.";
      } catch (_) {}
    }

    function validatePeriod(period, label) {
      if (!period.date_from || !period.date_to) {
        throw new Error(label + ": укажите даты начала и окончания.");
      }
      const from = new Date(period.date_from + "T" + (period.time_from || "00:00"));
      const to = new Date(period.date_to + "T" + (period.time_to || "23:59"));
      if (from > to) {
        throw new Error(label + ": дата начала не может быть позже окончания.");
      }
      return { from, to };
    }

    function buildUrl(form, period, label) {
      if (!form.project_id || !form.api_key || !form.card_id) {
        throw new Error("Заполните номер проекта, api_key и номер карты.");
      }
      const { from, to } = validatePeriod(period, label);

      const params = new URLSearchParams();
      params.set("project_id", form.project_id);
      params.set("api_key", form.api_key);
      params.set("card_id", form.card_id);
      params.set("date_range[date_from]", formatApiDate(from));
      params.set("date_range[time_from]", formatApiTimeFromInput(period.time_from));
      params.set("date_range[date_to]", formatApiDate(to));
      params.set("date_range[time_to]", formatApiTimeFromInput(period.time_to));

      return PROXY_BASE + "?" + params.toString();
    }

    async function fetchPeriod(url) {
      const res = await fetch(url, { method: "GET" });
      const text = await res.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch {
        data = text;
      }
      if (!res.ok) {
        const msg = typeof data === "object" && data && data.message
          ? data.message
          : "Ошибка " + res.status;
        throw new Error(msg);
      }
      return data;
    }

    function mergeComparison(aoa1, aoa2, title1, title2) {
      const rows1 = aoa1.slice(1);
      const rows2 = aoa2.slice(1);
      const max = Math.max(rows1.length, rows2.length);
      const header = [(aoa1[0] && aoa1[0][0]) || "Показатель", title1, title2];
      const body = [];
      for (let i = 0; i < max; i++) {
        const r1 = rows1[i] || ["", ""];
        const r2 = rows2[i] || ["", ""];
        body.push([r1[0] || r2[0] || "", r1[1] ?? "", r2[1] ?? ""]);
      }
      return [header, ...body];
    }

    function setStatus(text, type) {
      const el = document.getElementById("status");
      el.textContent = text;
      el.className = type || "";
    }

    function normalizeRows(data) {
      if (Array.isArray(data)) return data;
      if (data && typeof data === "object") {
        if (Array.isArray(data.data)) return data.data;
        if (Array.isArray(data.rows)) return data.rows;
        if (Array.isArray(data.result)) return data.result;
      }
      throw new Error("Ответ API: ожидался массив строк (column_1, column_2…).");
    }

    function getColumnKeys(rows) {
      const keys = new Set();
      for (const row of rows) {
        if (!row || typeof row !== "object") continue;
        for (const key of Object.keys(row)) {
          if (/^column_\d+$/i.test(key)) keys.add(key);
        }
      }
      if (keys.size === 0 && rows[0] && typeof rows[0] === "object") {
        return Object.keys(rows[0]);
      }
      return [...keys].sort((a, b) => {
        const na = parseInt(a.replace(/\D/g, ""), 10) || 0;
        const nb = parseInt(b.replace(/\D/g, ""), 10) || 0;
        return na - nb;
      });
    }

    function rowsToSheet(rows) {
      if (!rows.length) throw new Error("Пустой ответ: нет строк для таблицы.");
      const cols = getColumnKeys(rows);
      const aoa = rows.map((row) =>
        cols.map((col) => (row[col] != null ? String(row[col]) : ""))
      );
      return { cols, aoa };
    }

    function hideTable() {
      document.getElementById("tableSection").style.display = "none";
      document.getElementById("tableHead").innerHTML = "";
      document.getElementById("tableBody").innerHTML = "";
    }

    function renderTable(aoa) {
      if (!aoa.length) {
        hideTable();
        return;
      }
      const head = document.getElementById("tableHead");
      const body = document.getElementById("tableBody");
      const [header, ...dataRows] = aoa;

      head.innerHTML = "<tr>" + header.map((c) =>
        `<th>${escapeHtml(c)}</th>`
      ).join("") + "</tr>";

      body.innerHTML = dataRows.map((row) =>
        "<tr>" + row.map((cell) =>
          `<td>${escapeHtml(cell)}</td>`
        ).join("") + "</tr>"
      ).join("");

      document.getElementById("tableSection").style.display = "block";
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function downloadXlsx(aoa, filename) {
      if (typeof XLSX === "undefined") {
        throw new Error("Библиотека Excel не загрузилась. Обновите страницу.");
      }
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Сравнение");
      XLSX.writeFile(wb, filename);
    }

    function makeFilename(form) {
      const p1 = form.period1.date_from.replace(/-/g, "") + "-" + form.period1.date_to.replace(/-/g, "");
      const p2 = form.period2.date_from.replace(/-/g, "") + "-" + form.period2.date_to.replace(/-/g, "");
      return "compare_" + form.card_id + "_p1_" + p1 + "_p2_" + p2 + ".xlsx";
    }

    function displayComparison(data1, data2, form) {
      const aoa1 = rowsToSheet(normalizeRows(data1)).aoa;
      const aoa2 = rowsToSheet(normalizeRows(data2)).aoa;
      const label1 = "Период 1 (" + formatPeriodLabel(form.period1) + ")";
      const label2 = "Период 2 (" + formatPeriodLabel(form.period2) + ")";
      const merged = mergeComparison(aoa1, aoa2, label1, label2);
      lastSheetAoa = merged;
      document.getElementById("periodCaption").textContent =
        label1 + " · " + label2;
      renderTable(merged);
    }

    async function fetchData() {
      const form = readForm();
      saveSettings();

      let url1;
      let url2;
      try {
        url1 = buildUrl(form, form.period1, "Период 1");
        url2 = buildUrl(form, form.period2, "Период 2");
      } catch (e) {
        setStatus(e.message, "err");
        return;
      }

      const btn = document.getElementById("btnFetch");
      const btnDl = document.getElementById("btnDownload");
      btn.disabled = true;
      btnDl.disabled = true;
      setStatus("Загрузка периода 1 и периода 2…", "");

      try {
        const [data1, data2] = await Promise.all([
          fetchPeriod(url1),
          fetchPeriod(url2),
        ]);

        displayComparison(data1, data2, form);
        lastFilename = makeFilename(form);
        btnDl.disabled = false;
        setStatus("Сравнение готово. Можно скачать XLSX.", "ok");
      } catch (e) {
        lastSheetAoa = null;
        hideTable();
        document.getElementById("periodCaption").textContent = "";
        const hint = e.message === "Failed to fetch"
          ? "Не удалось выполнить запрос через прокси. Проверьте Worker в Cloudflare."
          : e.message;
        setStatus(hint, "err");
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById("btnFetch").addEventListener("click", fetchData);

    document.getElementById("btnDownload").addEventListener("click", () => {
      if (!lastSheetAoa || !lastSheetAoa.length) return;
      try {
        downloadXlsx(lastSheetAoa, lastFilename);
        setStatus("Файл скачан: " + lastFilename, "ok");
      } catch (e) {
        setStatus(e.message, "err");
      }
    });

    document.getElementById("btnCopyUrl").addEventListener("click", async () => {
      try {
        const form = readForm();
        const url1 = buildUrl(form, form.period1, "Период 1");
        const url2 = buildUrl(form, form.period2, "Период 2");
        await navigator.clipboard.writeText(
          "Период 1:\n" + url1 + "\n\nПериод 2:\n" + url2
        );
        setStatus("URL обоих периодов скопированы.", "ok");
      } catch (e) {
        setStatus(e.message, "err");
      }
    });

    ["project_id", "api_key", "card_id"].forEach((id) => {
      document.getElementById(id).addEventListener("change", saveSettings);
    });

    applyDefaultPeriods();
    loadSettings();
  </script>
</body>
</html>

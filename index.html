<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аналитика — custom-card</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --error: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin: 0 0 0.35rem;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.75rem;
    }
    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1.35rem;
      margin-bottom: 1rem;
    }
    section h2 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0 0 1rem;
      font-weight: 600;
    }
    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 0.35rem;
      color: var(--muted);
    }
    input[type="text"],
    input[type="password"],
    input[type="number"],
    input[type="date"],
    input[type="time"] {
      width: 100%;
      padding: 0.55rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 0.85rem;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .range-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem 1rem;
    }
    @media (max-width: 520px) {
      .range-grid { grid-template-columns: 1fr; }
    }
    .range-grid label { margin-bottom: 0.25rem; }
    .range-grid input { margin-bottom: 0; }
    .preset-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .preset-row button {
      padding: 0.35rem 0.65rem;
      font-size: 0.8rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--muted);
      cursor: pointer;
    }
    .preset-row button:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-top: 0.25rem;
    }
    button.primary {
      padding: 0.65rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button.primary:hover { background: var(--accent-hover); }
    button.primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    button.secondary {
      padding: 0.65rem 1.1rem;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }
    button.secondary:hover { border-color: var(--accent); }
    #status {
      margin-top: 1rem;
      font-size: 0.9rem;
      min-height: 1.4em;
    }
    #status.ok { color: var(--success); }
    #status.err { color: var(--error); }
    #preview {
      margin-top: 1rem;
      display: none;
    }
    #preview pre {
      margin: 0;
      padding: 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: auto;
      max-height: 320px;
      font-size: 0.8rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .hint {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: -0.5rem;
      margin-bottom: 0.85rem;
    }
    .saved-note {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Загрузка аналитической карточки</h1>
    <p class="subtitle">API: <code>analytics/custom-card</code> — результат можно скачать как JSON</p>

    <section>
      <h2>Параметры запроса</h2>
      <label for="project_id">project_id</label>
      <input type="text" id="project_id" placeholder="xx" autocomplete="off">

      <label for="api_key">api_key</label>
      <input type="password" id="api_key" placeholder="ключ API" autocomplete="off">
      <p class="hint">Ключ хранится только в браузере (localStorage), пока вы не очистите данные.</p>

      <label for="card_id">card_id</label>
      <input type="number" id="card_id" min="1" step="1" placeholder="1">
    </section>

    <section>
      <h2>Период</h2>
      <div class="range-grid">
        <div>
          <label for="date_from">Дата начала</label>
          <input type="date" id="date_from">
        </div>
        <div>
          <label for="time_from">Время начала</label>
          <input type="time" id="time_from" step="1">
        </div>
        <div>
          <label for="date_to">Дата окончания</label>
          <input type="date" id="date_to">
        </div>
        <div>
          <label for="time_to">Время окончания</label>
          <input type="time" id="time_to" step="1">
        </div>
      </div>
      <div class="preset-row">
        <button type="button" data-preset="yesterday">Вчера</button>
        <button type="button" data-preset="today">Сегодня</button>
        <button type="button" data-preset="last7">7 дней</button>
      </div>
    </section>

    <section>
      <h2>Действия</h2>
      <div class="actions">
        <button type="button" class="primary" id="btnFetch">Загрузить данные</button>
        <button type="button" class="secondary" id="btnDownload" disabled>Скачать JSON</button>
        <button type="button" class="secondary" id="btnCopyUrl">Скопировать URL</button>
      </div>
      <p class="saved-note" id="savedNote"></p>
      <div id="status"></div>
      <div id="preview">
        <label>Предпросмотр</label>
        <pre id="previewBody"></pre>
      </div>
    </section>
  </div>

  <script>
    const API_BASE = "https://go.robotmia.ru/api/analytics/custom-card";
    const STORAGE_KEY = "analytics-custom-card-settings";

    let lastPayload = null;
    let lastFilename = "custom-card.json";

    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    /** DD.MM.YYYY для API */
    function formatApiDate(d) {
      return `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.${d.getFullYear()}`;
    }

    function formatApiTimeFromInput(value) {
      if (!value) return "00:00:00";
      const parts = value.split(":");
      const h = parts[0] || "00";
      const m = parts[1] || "00";
      const s = parts[2] || "00";
      return `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
    }

    function toInputDate(d) {
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }

    function startOfDay(d) {
      const x = new Date(d);
      x.setHours(0, 0, 0, 0);
      return x;
    }

    function endOfDay(d) {
      const x = new Date(d);
      x.setHours(23, 59, 59, 999);
      return x;
    }

    function setRange(fromDate, toDate) {
      document.getElementById("date_from").value = toInputDate(fromDate);
      document.getElementById("time_from").value = "00:00:00";
      document.getElementById("date_to").value = toInputDate(toDate);
      document.getElementById("time_to").value = "23:59:59";
    }

    function applyPreset(name) {
      const now = new Date();
      const today = startOfDay(now);
      if (name === "yesterday") {
        const y = new Date(today);
        y.setDate(y.getDate() - 1);
        setRange(y, y);
        return;
      }
      if (name === "today") {
        setRange(today, today);
        return;
      }
      if (name === "last7") {
        const from = new Date(today);
        from.setDate(from.getDate() - 6);
        setRange(from, today);
      }
    }

    function readForm() {
      return {
        project_id: document.getElementById("project_id").value.trim(),
        api_key: document.getElementById("api_key").value.trim(),
        card_id: document.getElementById("card_id").value.trim(),
        date_from: document.getElementById("date_from").value,
        time_from: document.getElementById("time_from").value,
        date_to: document.getElementById("date_to").value,
        time_to: document.getElementById("time_to").value,
      };
    }

    function saveSettings() {
      const f = readForm();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          project_id: f.project_id,
          api_key: f.api_key,
          card_id: f.card_id,
        }));
        document.getElementById("savedNote").textContent =
          "project_id, api_key и card_id сохранены в этом браузере.";
      } catch (_) {
        document.getElementById("savedNote").textContent = "";
      }
    }

    function loadSettings() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const s = JSON.parse(raw);
        if (s.project_id) document.getElementById("project_id").value = s.project_id;
        if (s.api_key) document.getElementById("api_key").value = s.api_key;
        if (s.card_id) document.getElementById("card_id").value = s.card_id;
        document.getElementById("savedNote").textContent =
          "Загружены сохранённые project_id, api_key и card_id.";
      } catch (_) {}
    }

    function buildUrl(form) {
      if (!form.project_id || !form.api_key || !form.card_id) {
        throw new Error("Заполните project_id, api_key и card_id.");
      }
      if (!form.date_from || !form.date_to) {
        throw new Error("Укажите даты начала и окончания.");
      }

      const from = new Date(form.date_from + "T" + (form.time_from || "00:00"));
      const to = new Date(form.date_to + "T" + (form.time_to || "23:59"));
      if (from > to) {
        throw new Error("Дата/время начала не может быть позже окончания.");
      }

      const params = new URLSearchParams();
      params.set("project_id", form.project_id);
      params.set("api_key", form.api_key);
      params.set("card_id", form.card_id);
      params.set("date_range[date_from]", formatApiDate(from));
      params.set("date_range[time_from]", formatApiTimeFromInput(form.time_from));
      params.set("date_range[date_to]", formatApiDate(to));
      params.set("date_range[time_to]", formatApiTimeFromInput(form.time_to));

      return API_BASE + "?" + params.toString();
    }

    function setStatus(text, type) {
      const el = document.getElementById("status");
      el.textContent = text;
      el.className = type || "";
    }

    function showPreview(data) {
      const box = document.getElementById("preview");
      const pre = document.getElementById("previewBody");
      pre.textContent = typeof data === "string"
        ? data
        : JSON.stringify(data, null, 2);
      box.style.display = "block";
    }

    function downloadJson(data, filename) {
      const blob = new Blob(
        [typeof data === "string" ? data : JSON.stringify(data, null, 2)],
        { type: "application/json;charset=utf-8" }
      );
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function makeFilename(form) {
      const from = form.date_from.replace(/-/g, "");
      const to = form.date_to.replace(/-/g, "");
      return `custom-card_${form.card_id}_${from}-${to}.json`;
    }

    async function fetchData() {
      const form = readForm();
      saveSettings();

      let url;
      try {
        url = buildUrl(form);
      } catch (e) {
        setStatus(e.message, "err");
        return;
      }

      const btn = document.getElementById("btnFetch");
      const btnDl = document.getElementById("btnDownload");
      btn.disabled = true;
      btnDl.disabled = true;
      setStatus("Загрузка…", "");

      try {
        const res = await fetch(url, { method: "GET" });
        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch {
          data = text;
        }

        if (!res.ok) {
          const msg = typeof data === "object" && data && data.message
            ? data.message
            : `Ошибка ${res.status}`;
          throw new Error(msg);
        }

        lastPayload = data;
        lastFilename = makeFilename(form);
        showPreview(data);
        btnDl.disabled = false;
        setStatus("Данные получены. Можно скачать JSON.", "ok");
      } catch (e) {
        lastPayload = null;
        document.getElementById("preview").style.display = "none";
        const hint = e.message === "Failed to fetch"
          ? "Не удалось выполнить запрос (CORS или сеть). Откройте файл через локальный сервер или расширение CORS, либо скопируйте URL и откройте в новой вкладке."
          : e.message;
        setStatus(hint, "err");
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById("btnFetch").addEventListener("click", fetchData);

    document.getElementById("btnDownload").addEventListener("click", () => {
      if (lastPayload == null) return;
      downloadJson(lastPayload, lastFilename);
      setStatus("Файл скачан: " + lastFilename, "ok");
    });

    document.getElementById("btnCopyUrl").addEventListener("click", async () => {
      try {
        const url = buildUrl(readForm());
        await navigator.clipboard.writeText(url);
        setStatus("URL скопирован в буфер обмена.", "ok");
      } catch (e) {
        setStatus(e.message, "err");
      }
    });

    document.querySelectorAll("[data-preset]").forEach((btn) => {
      btn.addEventListener("click", () => applyPreset(btn.dataset.preset));
    });

    ["project_id", "api_key", "card_id"].forEach((id) => {
      document.getElementById(id).addEventListener("change", saveSettings);
    });

    applyPreset("yesterday");
    loadSettings();
  </script>
</body>
</html>

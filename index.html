<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сравнительный анализ таблиц</title>
  <script>
    (function () {
      var t = localStorage.getItem("table-analysis-theme");
      document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
    })();
  </script>
  <style>
    :root,
    [data-theme="dark"] {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --error: #ef4444;
      --table-th: #243044;
      --table-sticky-col: #1e2a3c;
      --table-hover-row: rgba(59, 130, 246, 0.06);
      --table-hover-first: #243044;
      --delta-up-bg: rgba(34, 197, 94, 0.28);
      --delta-up-fg: #bbf7d0;
      --delta-down-bg: rgba(244, 114, 182, 0.28);
      --delta-down-fg: #fbcfe8;
      --theme-toggle-bg: #243044;
      --theme-toggle-active: #3b82f6;
    }
    [data-theme="light"] {
      --bg: #eef1f6;
      --surface: #ffffff;
      --border: #c5ced9;
      --text: #15202b;
      --muted: #5f6d7e;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #16a34a;
      --error: #dc2626;
      --table-th: #dce4ef;
      --table-sticky-col: #e8edf4;
      --table-hover-row: rgba(37, 99, 235, 0.08);
      --table-hover-first: #dce4ef;
      --delta-up-bg: rgba(22, 163, 74, 0.2);
      --delta-up-fg: #15803d;
      --delta-down-bg: rgba(219, 39, 119, 0.18);
      --delta-down-fg: #be185d;
      --theme-toggle-bg: #e8edf4;
      --theme-toggle-active: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .top-bar {
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .top-bar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.85rem clamp(0.75rem, 2vw, 1.5rem);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem 1rem;
    }
    .top-bar h1 {
      font-size: 1.2rem;
      font-weight: 600;
      margin: 0;
    }
    .theme-switch {
      display: inline-flex;
      padding: 3px;
      border-radius: 8px;
      background: var(--theme-toggle-bg);
      border: 1px solid var(--border);
      gap: 2px;
    }
    .theme-switch button {
      padding: 0.4rem 0.75rem;
      font-size: 0.82rem;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
    }
    .theme-switch button:hover {
      color: var(--text);
    }
    .theme-switch button.active {
      background: var(--theme-toggle-active);
      color: #fff;
      font-weight: 600;
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 1.5rem;
    }
    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1.35rem;
      margin-bottom: 1rem;
    }
    section h2 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0 0 1rem;
      font-weight: 600;
    }
    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 0.35rem;
      color: var(--muted);
    }
    input[type="text"],
    input[type="password"],
    input[type="number"],
    input[type="date"],
    input[type="time"],
    input[type="file"] {
      width: 100%;
      padding: 0.55rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 0.85rem;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .range-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem 1rem;
    }
    @media (max-width: 520px) {
      .range-grid { grid-template-columns: 1fr; }
    }
    .range-grid label { margin-bottom: 0.25rem; }
    .range-grid input { margin-bottom: 0; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-top: 0.25rem;
    }
    button.primary {
      padding: 0.65rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button.primary:hover { background: var(--accent-hover); }
    button.primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    button.secondary {
      padding: 0.65rem 1.1rem;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }
    button.secondary:hover { border-color: var(--accent); }
    button.secondary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .hint {
      font-size: 0.78rem;
      color: var(--muted);
      margin: -0.35rem 0 0.85rem;
    }
    #status {
      margin-top: 1rem;
      font-size: 0.9rem;
      min-height: 1.4em;
    }
    #status.ok { color: var(--success); }
    #status.err { color: var(--error); }
    #resultsSection {
      display: none;
      width: 100%;
      max-width: 100vw;
      margin: 0;
      padding: 1.25rem clamp(0.75rem, 2vw, 1.5rem) 2rem;
      border-radius: 0;
      border-left: none;
      border-right: none;
    }
    .period-block {
      margin-bottom: 1.75rem;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 100%;
      min-height: 0;
    }
    .period-block:last-child {
      margin-bottom: 0;
    }
    .block-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      margin-bottom: 0.6rem;
    }
    .block-header h3 {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 0;
      color: var(--text);
      flex: 1 1 auto;
    }
    .table-wrap {
      width: max-content;
      max-width: 100%;
      max-height: calc(100vh - 10rem);
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      -webkit-overflow-scrolling: touch;
    }
    .data-table {
      width: max-content;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .data-table th,
    .data-table td {
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      padding: 0.45rem 0.6rem;
      text-align: left;
      vertical-align: top;
      max-width: min(280px, 40vw);
      white-space: nowrap;
    }
    .data-table td:first-child,
    .data-table th:first-child {
      white-space: normal;
      max-width: min(220px, 35vw);
    }
    .data-table th:last-child,
    .data-table td:last-child {
      border-right: none;
    }
    .data-table th {
      background: var(--table-th);
      color: var(--text);
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .data-table td:first-child,
    .data-table th:first-child {
      position: sticky;
      left: 0;
      z-index: 2;
      background: var(--table-sticky-col);
      min-width: auto;
    }
    .data-table thead th:first-child {
      z-index: 3;
      background: var(--table-th);
    }
    .data-table tbody tr:last-child td {
      border-bottom: none;
    }
    .data-table tbody tr:hover td {
      background: var(--table-hover-row);
    }
    .data-table tbody tr:hover td:first-child {
      background: var(--table-hover-first);
    }
    .data-table td.delta-up {
      background: var(--delta-up-bg);
      color: var(--delta-up-fg);
      font-weight: 600;
    }
    .data-table td.delta-down {
      background: var(--delta-down-bg);
      color: var(--delta-down-fg);
      font-weight: 600;
    }
    .data-table td.delta-zero {
      color: var(--muted);
    }
    .file-row {
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <h1>Сравнительный анализ таблиц</h1>
      <div class="theme-switch" role="group" aria-label="Тема оформления">
        <button type="button" id="themeDark">Тёмная</button>
        <button type="button" id="themeLight" class="active">Светлая</button>
      </div>
    </div>
  </header>
  <div class="wrap">

    <section>
      <h2>Параметры API</h2>
      <label for="project_id">Номер проекта</label>
      <input type="text" id="project_id" placeholder="xx" autocomplete="off">

      <label for="api_key">api_key</label>
      <input type="password" id="api_key" placeholder="ключ API" autocomplete="off">

      <label for="card_id">Номер карты</label>
      <input type="number" id="card_id" min="1" step="1" placeholder="1">
    </section>

    <section>
      <h2>Период 1</h2>
      <div class="range-grid">
        <div>
          <label for="date_from_p1">Дата начала</label>
          <input type="date" id="date_from_p1">
        </div>
        <div>
          <label for="time_from_p1">Время начала</label>
          <input type="time" id="time_from_p1" step="1">
        </div>
        <div>
          <label for="date_to_p1">Дата окончания</label>
          <input type="date" id="date_to_p1">
        </div>
        <div>
          <label for="time_to_p1">Время окончания</label>
          <input type="time" id="time_to_p1" step="1">
        </div>
      </div>
    </section>

    <section>
      <h2>Период 2</h2>
      <div class="range-grid">
        <div>
          <label for="date_from_p2">Дата начала</label>
          <input type="date" id="date_from_p2">
        </div>
        <div>
          <label for="time_from_p2">Время начала</label>
          <input type="time" id="time_from_p2" step="1">
        </div>
        <div>
          <label for="date_to_p2">Дата окончания</label>
          <input type="date" id="date_to_p2">
        </div>
        <div>
          <label for="time_to_p2">Время окончания</label>
          <input type="time" id="time_to_p2" step="1">
        </div>
      </div>
    </section>

    <section>
      <h2>Загрузка по API</h2>
      <div class="actions">
        <button type="button" class="primary" id="btnFetch">Загрузить данные по API</button>
      </div>
      <div id="status"></div>
    </section>

    <section>
      <h2>Загрузка из файла</h2>
      <p class="hint">CSV или Excel (.xlsx) для каждого периода: первая строка — заголовки столбцов, далее строки со сценариями (как в выгрузке custom-table).</p>
      <div class="file-row">
        <label for="file_p1">Файл периода 1</label>
        <input type="file" id="file_p1" accept=".csv,.xlsx,.xls,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
      </div>
      <div class="file-row">
        <label for="file_p2">Файл периода 2</label>
        <input type="file" id="file_p2" accept=".csv,.xlsx,.xls,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
      </div>
      <div class="actions">
        <button type="button" class="primary" id="btnLoadFiles">Загрузить из файлов</button>
      </div>
    </section>
  </div>

  <section id="resultsSection">
    <h2>Результаты</h2>
    <div class="period-block">
      <div class="block-header">
        <h3 id="captionCmp">Сравнение</h3>
        <button type="button" class="secondary btn-dl-table" id="btnDownloadCmp" disabled>Скачать XLSX</button>
      </div>
      <div class="table-wrap">
          <table class="data-table">
            <thead id="headCmp"></thead>
            <tbody id="bodyCmp"></tbody>
          </table>
        </div>
      </div>
    <div class="period-block">
      <div class="block-header">
        <h3 id="captionP1">Период 1</h3>
        <button type="button" class="secondary btn-dl-table" id="btnDownloadP1" disabled>Скачать XLSX</button>
      </div>
      <div class="table-wrap">
          <table class="data-table">
            <thead id="headP1"></thead>
            <tbody id="bodyP1"></tbody>
          </table>
        </div>
      </div>
    <div class="period-block">
      <div class="block-header">
        <h3 id="captionP2">Период 2</h3>
        <button type="button" class="secondary btn-dl-table" id="btnDownloadP2" disabled>Скачать XLSX</button>
      </div>
      <div class="table-wrap">
          <table class="data-table">
            <thead id="headP2"></thead>
            <tbody id="bodyP2"></tbody>
          </table>
        </div>
      </div>
  </section>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script>
    const PROXY_BASE = "https://robotmia-analytics-proxy.a-mozzherin.workers.dev";
    const STORAGE_KEY = "analytics-custom-card-settings";
    const THEME_KEY = "table-analysis-theme";

    function applyTheme(theme) {
      const t = theme === "light" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
      document.getElementById("themeDark").classList.toggle("active", t === "dark");
      document.getElementById("themeLight").classList.toggle("active", t === "light");
      try {
        localStorage.setItem(THEME_KEY, t);
      } catch (_) {}
    }

    function initTheme() {
      let t = "light";
      try {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === "light" || saved === "dark") t = saved;
      } catch (_) {}
      applyTheme(t);
    }

    document.getElementById("themeDark").addEventListener("click", () => applyTheme("dark"));
    document.getElementById("themeLight").addEventListener("click", () => applyTheme("light"));
    initTheme();

    let exportWorkbook = { p1: null, p2: null, compare: null };

    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function formatApiDate(d) {
      return pad2(d.getDate()) + "." + pad2(d.getMonth() + 1) + "." + d.getFullYear();
    }

    function formatApiTimeFromInput(value) {
      if (!value) return "00:00:00";
      const parts = value.split(":");
      const h = parts[0] || "00";
      const m = parts[1] || "00";
      const s = parts[2] || "00";
      return pad2(h) + ":" + pad2(m) + ":" + pad2(s);
    }

    function toInputDate(d) {
      return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
    }

    function startOfDay(d) {
      const x = new Date(d);
      x.setHours(0, 0, 0, 0);
      return x;
    }

    function setPeriodRange(prefix, fromDate, toDate) {
      document.getElementById("date_from_" + prefix).value = toInputDate(fromDate);
      document.getElementById("time_from_" + prefix).value = "00:00:00";
      document.getElementById("date_to_" + prefix).value = toInputDate(toDate);
      document.getElementById("time_to_" + prefix).value = "23:59:59";
    }

    function applyDefaultPeriods() {
      const today = startOfDay(new Date());
      const p2End = new Date(today);
      p2End.setDate(p2End.getDate() - 1);
      const p2Start = new Date(p2End);
      p2Start.setDate(p2Start.getDate() - 6);

      const p1End = new Date(p2Start);
      p1End.setDate(p1End.getDate() - 1);
      const p1Start = new Date(p1End);
      p1Start.setDate(p1Start.getDate() - 6);

      setPeriodRange("p1", p1Start, p1End);
      setPeriodRange("p2", p2Start, p2End);
    }

    function readPeriodFields(prefix) {
      return {
        date_from: document.getElementById("date_from_" + prefix).value,
        time_from: document.getElementById("time_from_" + prefix).value,
        date_to: document.getElementById("date_to_" + prefix).value,
        time_to: document.getElementById("time_to_" + prefix).value,
      };
    }

    function readForm() {
      return {
        project_id: document.getElementById("project_id").value.trim(),
        api_key: document.getElementById("api_key").value.trim(),
        card_id: document.getElementById("card_id").value.trim(),
        period1: readPeriodFields("p1"),
        period2: readPeriodFields("p2"),
      };
    }

    function formatPeriodLabel(period) {
      const from = new Date(period.date_from + "T00:00:00");
      const to = new Date(period.date_to + "T00:00:00");
      return formatApiDate(from) + " – " + formatApiDate(to);
    }

    function saveSettings() {
      const f = readForm();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          project_id: f.project_id,
          api_key: f.api_key,
          card_id: f.card_id,
        }));
      } catch (_) {}
    }

    function loadSettings() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const s = JSON.parse(raw);
        if (s.project_id) document.getElementById("project_id").value = s.project_id;
        if (s.api_key) document.getElementById("api_key").value = s.api_key;
        if (s.card_id) document.getElementById("card_id").value = s.card_id;
      } catch (_) {}
    }

    function validatePeriod(period, label) {
      if (!period.date_from || !period.date_to) {
        throw new Error(label + ": укажите даты начала и окончания.");
      }
      const from = new Date(period.date_from + "T" + (period.time_from || "00:00"));
      const to = new Date(period.date_to + "T" + (period.time_to || "23:59"));
      if (from > to) {
        throw new Error(label + ": дата начала не может быть позже окончания.");
      }
      return { from, to };
    }

    function buildUrl(form, period, label) {
      if (!form.project_id || !form.api_key || !form.card_id) {
        throw new Error("Заполните номер проекта, api_key и номер карты.");
      }
      const { from, to } = validatePeriod(period, label);

      const params = new URLSearchParams();
      params.set("project_id", form.project_id);
      params.set("api_key", form.api_key);
      params.set("card_id", form.card_id);
      params.set("date_range[date_from]", formatApiDate(from));
      params.set("date_range[time_from]", formatApiTimeFromInput(period.time_from));
      params.set("date_range[date_to]", formatApiDate(to));
      params.set("date_range[time_to]", formatApiTimeFromInput(period.time_to));

      return PROXY_BASE + "?" + params.toString();
    }

    function setStatus(text, type) {
      const el = document.getElementById("status");
      el.textContent = text;
      el.className = type || "";
    }

    function trimAoa(aoa) {
      const rows = aoa
        .map((row) => (Array.isArray(row) ? row.map((c) => (c == null ? "" : String(c))) : []))
        .filter((row) => row.some((cell) => String(cell).trim() !== ""));
      if (!rows.length) return [];
      let maxCols = 0;
      rows.forEach((r) => { if (r.length > maxCols) maxCols = r.length; });
      return rows.map((row) => {
        const r = row.slice();
        while (r.length < maxCols) r.push("");
        while (r.length > 0 && r[r.length - 1].trim() === "") r.pop();
        return r;
      });
    }

    function parseUploadedFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type: "array", raw: false });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const aoa = trimAoa(XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" }));
            if (!aoa.length) throw new Error("Файл пустой или не распознан.");
            resolve(aoa);
          } catch (err) {
            reject(err);
          }
        };
        reader.onerror = () => reject(new Error("Не удалось прочитать файл."));
        reader.readAsArrayBuffer(file);
      });
    }

    function normalizeRows(data) {
      if (Array.isArray(data)) return data;
      if (data && typeof data === "object") {
        if (Array.isArray(data.data)) return data.data;
        if (Array.isArray(data.rows)) return data.rows;
        if (Array.isArray(data.result)) return data.result;
      }
      throw new Error("Ответ API: ожидался массив строк.");
    }

    function getColumnKeys(rows) {
      const keys = new Set();
      for (const row of rows) {
        if (!row || typeof row !== "object") continue;
        for (const key of Object.keys(row)) {
          if (/^column_\d+$/i.test(key)) keys.add(key);
        }
      }
      if (keys.size === 0 && rows[0] && typeof rows[0] === "object") {
        return Object.keys(rows[0]);
      }
      return [...keys].sort((a, b) => {
        const na = parseInt(a.replace(/\D/g, ""), 10) || 0;
        const nb = parseInt(b.replace(/\D/g, ""), 10) || 0;
        return na - nb;
      });
    }

    /** API custom-card: узкая таблица «показатель — значение» */
    function apiRowsToAoa(rows) {
      if (!rows.length) throw new Error("Пустой ответ API.");
      const cols = getColumnKeys(rows);
      return rows.map((row) =>
        cols.map((col) => (row[col] != null ? String(row[col]) : ""))
      );
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function alignTables(aoa1, aoa2) {
      const maxR = Math.max(aoa1.length, aoa2.length);
      const maxC = Math.max(
        0,
        ...aoa1.map((r) => r.length),
        ...aoa2.map((r) => r.length)
      );
      function pad(aoa) {
        const out = [];
        for (let i = 0; i < maxR; i++) {
          const row = (aoa[i] || []).slice();
          while (row.length < maxC) row.push("");
          out.push(row.map((c) => (c == null ? "" : String(c))));
        }
        return out;
      }
      return [pad(aoa1), pad(aoa2)];
    }

    function parseNumericValue(raw) {
      const s = String(raw).trim();
      if (!s || s === "-") return null;
      if (/^nan%$/i.test(s)) return { value: 0, hasPercent: true };
      if (/^nan$/i.test(s)) return { value: 0, hasPercent: false };
      if (/[a-zA-Zа-яА-ЯёЁ]/.test(s)) return null;

      const hasPercent = s.indexOf("%") >= 0;
      let cleaned = s.replace(/\s/g, "").replace(/%/g, "");

      const lastComma = cleaned.lastIndexOf(",");
      const lastDot = cleaned.lastIndexOf(".");
      if (lastComma >= 0 && lastDot >= 0) {
        if (lastComma > lastDot) {
          cleaned = cleaned.replace(/\./g, "").replace(",", ".");
        } else {
          cleaned = cleaned.replace(/,/g, "");
        }
      } else if (lastComma >= 0) {
        const parts = cleaned.split(",");
        if (parts.length === 2 && parts[1].length <= 2) {
          cleaned = parts[0].replace(/\./g, "") + "." + parts[1];
        } else {
          cleaned = cleaned.replace(/,/g, "");
        }
      }

      const num = parseFloat(cleaned);
      if (Number.isNaN(num)) return null;
      return { value: num, hasPercent: hasPercent };
    }

    function formatDelta(delta, meta1, meta2) {
      const usePercent = meta1.hasPercent || meta2.hasPercent;
      const abs = Math.abs(delta);
      let formatted;
      if (Math.abs(delta - Math.round(delta)) < 1e-9) {
        formatted = String(Math.round(delta));
      } else if (abs >= 10) {
        formatted = delta.toFixed(1).replace(/\.0$/, "");
      } else {
        formatted = delta.toFixed(2).replace(/\.?0+$/, "");
      }
      if (delta > 0) formatted = "+" + formatted;
      if (usePercent) formatted += "%";
      return formatted;
    }

    function buildComparisonCell(v1, v2) {
      const text1 = String(v1 ?? "").trim();
      const n1 = parseNumericValue(text1);
      if (!n1) {
        return { text: text1, kind: "text" };
      }
      const n2 = parseNumericValue(v2);
      if (!n2) {
        return { text: text1, kind: "text" };
      }
      const delta = n2.value - n1.value;
      const kind = delta > 0 ? "up" : delta < 0 ? "down" : "zero";
      return { text: formatDelta(delta, n1, n2), kind: kind };
    }

    function buildComparisonAoa(aoa1, aoa2) {
      const [t1, t2] = alignTables(aoa1, aoa2);
      return t1.map((row, ri) =>
        row.map((cell, ci) => buildComparisonCell(cell, t2[ri][ci]))
      );
    }

    function comparisonToAoa(cells) {
      return cells.map((row) => row.map((c) => c.text));
    }

    function renderPeriodTable(headId, bodyId, aoa) {
      const head = document.getElementById(headId);
      const body = document.getElementById(bodyId);
      if (!aoa.length) {
        head.innerHTML = "";
        body.innerHTML = "";
        return;
      }
      const [header, ...dataRows] = aoa;
      head.innerHTML = "<tr>" + header.map((c) =>
        "<th>" + escapeHtml(c) + "</th>"
      ).join("") + "</tr>";
      body.innerHTML = dataRows.map((row) =>
        "<tr>" + row.map((cell) =>
          "<td>" + escapeHtml(cell) + "</td>"
        ).join("") + "</tr>"
      ).join("");
    }

    function renderComparisonTable(cells) {
      const head = document.getElementById("headCmp");
      const body = document.getElementById("bodyCmp");
      if (!cells.length) {
        head.innerHTML = "";
        body.innerHTML = "";
        return;
      }
      const [headerCells, ...dataCells] = cells;
      head.innerHTML = "<tr>" + headerCells.map((c) =>
        "<th>" + escapeHtml(c.text) + "</th>"
      ).join("") + "</tr>";
      body.innerHTML = dataCells.map((row) =>
        "<tr>" + row.map((c) => {
          const cls = c.kind === "up" ? "delta-up"
            : c.kind === "down" ? "delta-down"
            : c.kind === "zero" ? "delta-zero"
            : "";
          return "<td" + (cls ? ' class="' + cls + '"' : "") + ">" + escapeHtml(c.text) + "</td>";
        }).join("") + "</tr>"
      ).join("");
    }

    function setDownloadButtonsEnabled(enabled) {
      ["btnDownloadCmp", "btnDownloadP1", "btnDownloadP2"].forEach((id) => {
        document.getElementById(id).disabled = !enabled;
      });
    }

    function hideResults() {
      document.getElementById("resultsSection").style.display = "none";
      exportWorkbook = { p1: null, p2: null, compare: null };
      setDownloadButtonsEnabled(false);
    }

    function displayResults(aoa1, aoa2, captionCmp, caption1, caption2) {
      const comparisonCells = buildComparisonAoa(aoa1, aoa2);
      exportWorkbook = {
        p1: aoa1,
        p2: aoa2,
        compare: comparisonToAoa(comparisonCells),
      };
      document.getElementById("captionCmp").textContent = captionCmp;
      document.getElementById("captionP1").textContent = caption1;
      document.getElementById("captionP2").textContent = caption2;
      renderComparisonTable(comparisonCells);
      renderPeriodTable("headP1", "bodyP1", aoa1);
      renderPeriodTable("headP2", "bodyP2", aoa2);
      document.getElementById("resultsSection").style.display = "block";
      setDownloadButtonsEnabled(true);
    }

    function makeFilenameBase(form) {
      const p1 = form.period1.date_from.replace(/-/g, "") + "-" + form.period1.date_to.replace(/-/g, "");
      const p2 = form.period2.date_from.replace(/-/g, "") + "-" + form.period2.date_to.replace(/-/g, "");
      const card = form.card_id ? form.card_id + "_" : "";
      return "compare_" + card + "p1_" + p1 + "_p2_" + p2;
    }

    function stripLeadingPlus(cell) {
      const s = String(cell).trim();
      if (s.charAt(0) !== "+") return cell;
      const rest = s.slice(1).trim();
      if (/^[\d\s.,%-]+$/.test(rest)) return rest;
      return cell;
    }

    function prepareComparisonForExport(aoa) {
      return aoa.map((row) => row.map((cell) => stripLeadingPlus(cell)));
    }

    function downloadSingleSheet(aoa, sheetLabel, suffix) {
      if (typeof XLSX === "undefined") {
        throw new Error("Библиотека Excel не загрузилась. Обновите страницу.");
      }
      if (!aoa || !aoa.length) return;
      const data = suffix === "comparison" ? prepareComparisonForExport(aoa) : aoa;
      const form = readForm();
      const filename = makeFilenameBase(form) + "_" + suffix + ".xlsx";
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), sheetLabel);
      XLSX.writeFile(wb, filename);
      return filename;
    }

    async function fetchPeriod(url) {
      const res = await fetch(url, { method: "GET" });
      const text = await res.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch {
        data = text;
      }
      if (!res.ok) {
        const msg = typeof data === "object" && data && data.message
          ? data.message
          : "Ошибка " + res.status;
        throw new Error(msg);
      }
      return data;
    }

    async function fetchData() {
      const form = readForm();
      saveSettings();

      let url1;
      let url2;
      try {
        url1 = buildUrl(form, form.period1, "Период 1");
        url2 = buildUrl(form, form.period2, "Период 2");
      } catch (e) {
        setStatus(e.message, "err");
        return;
      }

      const btn = document.getElementById("btnFetch");
      btn.disabled = true;
      setDownloadButtonsEnabled(false);
      setStatus("Загрузка периода 1 и периода 2…", "");

      try {
        const [data1, data2] = await Promise.all([
          fetchPeriod(url1),
          fetchPeriod(url2),
        ]);

        const aoa1 = apiRowsToAoa(normalizeRows(data1));
        const aoa2 = apiRowsToAoa(normalizeRows(data2));
        const capCmp = "Сравнение (дельта: период 2 − период 1)";
        const cap1 = "Исходные данные — период 1 (" + formatPeriodLabel(form.period1) + ")";
        const cap2 = "Исходные данные — период 2 (" + formatPeriodLabel(form.period2) + ")";

        displayResults(aoa1, aoa2, capCmp, cap1, cap2);
        setStatus("Данные загружены. Каждую таблицу можно скачать отдельно.", "ok");
      } catch (e) {
        hideResults();
        const hint = e.message === "Failed to fetch"
          ? "Не удалось выполнить запрос через прокси. Проверьте Worker в Cloudflare."
          : e.message;
        setStatus(hint, "err");
      } finally {
        btn.disabled = false;
      }
    }

    async function loadFromFiles() {
      const file1 = document.getElementById("file_p1").files[0];
      const file2 = document.getElementById("file_p2").files[0];
      if (!file1 || !file2) {
        setStatus("Выберите файл для периода 1 и периода 2.", "err");
        return;
      }

      const form = readForm();
      const btn = document.getElementById("btnLoadFiles");
      btn.disabled = true;
      setDownloadButtonsEnabled(false);
      setStatus("Чтение файлов…", "");

      try {
        validatePeriod(form.period1, "Период 1");
        validatePeriod(form.period2, "Период 2");
        const [aoa1, aoa2] = await Promise.all([
          parseUploadedFile(file1),
          parseUploadedFile(file2),
        ]);

        const capCmp = "Сравнение (дельта: период 2 − период 1)";
        const cap1 = "Исходные данные — период 1 (" + formatPeriodLabel(form.period1) + ") — " + file1.name;
        const cap2 = "Исходные данные — период 2 (" + formatPeriodLabel(form.period2) + ") — " + file2.name;

        displayResults(aoa1, aoa2, capCmp, cap1, cap2);
        setStatus("Файлы загружены. Каждую таблицу можно скачать отдельно.", "ok");
      } catch (e) {
        hideResults();
        setStatus(e.message, "err");
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById("btnFetch").addEventListener("click", fetchData);
    document.getElementById("btnLoadFiles").addEventListener("click", loadFromFiles);
    document.getElementById("btnDownloadCmp").addEventListener("click", () => {
      try {
        const name = downloadSingleSheet(exportWorkbook.compare, "Сравнение", "comparison");
        setStatus("Скачан: " + name, "ok");
      } catch (e) {
        setStatus(e.message, "err");
      }
    });
    document.getElementById("btnDownloadP1").addEventListener("click", () => {
      try {
        const name = downloadSingleSheet(exportWorkbook.p1, "Период 1", "period1");
        setStatus("Скачан: " + name, "ok");
      } catch (e) {
        setStatus(e.message, "err");
      }
    });
    document.getElementById("btnDownloadP2").addEventListener("click", () => {
      try {
        const name = downloadSingleSheet(exportWorkbook.p2, "Период 2", "period2");
        setStatus("Скачан: " + name, "ok");
      } catch (e) {
        setStatus(e.message, "err");
      }
    });

    ["project_id", "api_key", "card_id"].forEach((id) => {
      document.getElementById(id).addEventListener("change", saveSettings);
    });

    applyDefaultPeriods();
    loadSettings();
  </script>
</body>
</html>
